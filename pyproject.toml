[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rea-auto"
version = "0.1.1a2"
description = "Evidence-first reverse engineering for automotive embedded builds (AURIX TC3xx, AUTOSAR Classic)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]  # 1.x (FastMCP) and 2.x (MCPServer) both supported
dev = ["pytest>=8", "hypothesis>=6", "pyyaml>=6", "ruff>=0.5"]
yaml = ["pyyaml>=6"]

[project.scripts]
rea-auto = "reauto.cli:main"
rea-auto-mcp = "reauto.mcp_server:main"

[tool.setuptools.packages.find]
include = ["reauto*"]

[tool.setuptools.package-data]
"reauto.silicon.infineon.aurix" = ["targets/*.json"]
"reauto.architecture.tricore" = ["*.json"]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["fixtures/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E731", "B905", "B007", "E741"]

[tool.ruff.lint.per-file-ignores]
"fixtures/synthetic/make_fixtures.py" = ["E501"]  # fixed-width map/A2L text

[tool.pytest.ini_options]
testpaths = ["tests"]
